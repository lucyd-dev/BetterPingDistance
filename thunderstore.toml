[config]
schemaVersion = "0.0.1"

[general]
repository = "https://thunderstore.io"

[package]
namespace = "LucydDemon"
name = "BetterPingDistance"
description = "Shows the distance to pings above it. A small but useful QoL mod."
websiteUrl = "https://github.com/lucyd-dev/BetterPingDistance/"
containsNsfwContent = false
[package.dependencies]
BepInEx-BepInExPack_PEAK = "5.4.2403"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "../Packages"

[[build.copy]]
source = "./artifacts/bin/BetterPingDistance/release/lucyddemon.betterpingdistance.dll"
target = "BepInEx/plugins/BetterPingDistance/lucyddemon.betterpingdistance.dll"

[[build.copy]]
source = "./LICENSE"
target = "LICENSE"

[[build.copy]]
source = "./CHANGELOG.md"
target = "CHANGELOG.md"

[publish]
communities = [ "peak" ]
[publish.categories]
peak = [ "mods", "qol", "client", "misc" ]
